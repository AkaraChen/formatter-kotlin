[package]
name = "formatter-kotlin"
version = "0.1.0"
edition = "2024"
description = "A Kotlin source code formatter built on Topiary"
license = "MIT"

[lib]
name = "formatter_kotlin"
path = "src/lib.rs"

[[bin]]
name = "formatter-kotlin"
path = "src/main.rs"

[dependencies]
topiary-core = "0.7"
topiary-tree-sitter-facade = "0.7"
tree-sitter = "0.26"
tree-sitter-kotlin-ng = "1.1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1.4"
